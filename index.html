<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceLink Pro – Smart P2P Calling</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 430px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    header { text-align: center; }
    header h1 { font-size: 1.5rem; color: #38bdf8; }
    header p { font-size: 0.82rem; color: #94a3b8; margin-top: 4px; }
    
    .id-card { background: #0b0f19; border: 1px dashed #38bdf8; padding: 14px; border-radius: 12px; text-align: center; }
    .id-value { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: #38bdf8; letter-spacing: 1px; }
    
    .link-btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .mini-btn { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .mini-btn:hover { background: #334155; color: white; }

    input[type="text"] { width: 100%; padding: 14px; background: #0b0f19; border: 1px solid #374151; border-radius: 12px; color: white; font-size: 1rem; outline: none; text-align: center; font-family: monospace; }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-green { background: #10b981; color: white; }
    .btn-green:hover { background: #059669; }
    .btn-red { background: #ef4444; color: white; }
    .btn-red:hover { background: #dc2626; }
    .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    .status-text { font-size: 0.8rem; color: #94a3b8; text-align: center; }

    /* In-Call Screen */
    #activeCallScreen { display: none; text-align: center; }
    .timer-badge { display: inline-block; background: #1e293b; padding: 6px 14px; border-radius: 20px; font-family: monospace; font-size: 1.1rem; color: #10b981; font-weight: 700; }
    .call-controls { display: flex; gap: 10px; margin-top: 10px; }
    .control-btn { flex: 1; padding: 12px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .control-btn.active-off { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }

    canvas { width: 100%; height: 44px; background: #0b0f19; border-radius: 8px; border: 1px solid #1f2937; display: block; }
    .meter-label { font-size: 0.75rem; color: #94a3b8; text-align: left; text-transform: uppercase; margin-bottom: 4px; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-box { width: 100%; max-width: 340px; background: #111827; border: 1px solid #374151; border-radius: 20px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
    .pulse-avatar { width: 68px; height: 68px; margin: 0 auto; border-radius: 50%; background: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; animation: pulse-ring 1.5s infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(2,132,199,0.7); } 70% { box-shadow: 0 0 0 16px rgba(2,132,199,0); } 100% { box-shadow: 0 0 0 0 rgba(2,132,199,0); } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>VoiceLink Pro</h1>
      <p>Auto-Reconnecting P2P Voice Calling</p>
    </header>

    <!-- DIALER SCREEN -->
    <div class="card" id="dialerScreen">
      <div>
        <div class="meter-label" style="text-align:center;">Your ID & Invite</div>
        <div class="id-card">
          <div class="id-value" id="myPeerId">Connecting...</div>
          <div class="link-btn-group">
            <button class="mini-btn" onclick="copyIdOnly()">📋 Copy ID</button>
            <button class="mini-btn" onclick="copyInviteLink()">🔗 Copy Call Link</button>
          </div>
        </div>
      </div>

      <div>
        <label class="meter-label">Enter Friend's Call ID</label>
        <input type="text" id="targetPeerId" placeholder="e.g. vl-4821" />
      </div>

      <button class="btn btn-green" id="callBtn" onclick="startCall()" disabled>
        📞 Start Voice Call
      </button>

      <div class="status-text" id="appStatus">Connecting to WebRTC gateway...</div>
    </div>

    <!-- ACTIVE CALL SCREEN -->
    <div class="card" id="activeCallScreen">
      <div>
        <div class="timer-badge" id="callTimer">00:00</div>
        <div style="font-size: 1rem; font-weight: 700; margin-top: 6px;" id="partnerName">In Call</div>
      </div>

      <div>
        <div class="meter-label">Your Voice</div>
        <canvas id="localCanvas"></canvas>
      </div>

      <div>
        <div class="meter-label">Partner's Voice</div>
        <canvas id="remoteCanvas"></canvas>
      </div>

      <div class="call-controls">
        <button class="control-btn" id="muteBtn" onclick="toggleMute()">🎤 Mute</button>
        <button class="control-btn" id="deafenBtn" onclick="toggleDeafen()">🔊 Deafen</button>
      </div>

      <button class="btn btn-red" onclick="hangUp(true)">
        🛑 End Call
      </button>
    </div>
  </div>

  <!-- INCOMING CALL MODAL -->
  <div class="modal-overlay" id="incomingModal">
    <div class="modal-box">
      <div class="pulse-avatar">📲</div>
      <div>
        <h3>Incoming Voice Call</h3>
        <p style="font-family: monospace; color: #38bdf8; margin-top: 4px;" id="callerIdLabel">vl-XXXX</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-green" onclick="acceptCall()">Accept</button>
        <button class="btn btn-red" onclick="rejectCall()">Decline</button>
      </div>
    </div>
  </div>

  <!-- OUTGOING CALL MODAL -->
  <div class="modal-overlay" id="outgoingModal">
    <div class="modal-box">
      <div class="pulse-avatar">📞</div>
      <div>
        <h3 id="outgoingTitle">Calling...</h3>
        <p style="font-family: monospace; color: #38bdf8; margin-top: 4px;" id="dialingIdLabel">vl-XXXX</p>
        <small style="color: #94a3b8;" id="dialingSubtext">Connecting...</small>
      </div>
      <button class="btn btn-red" onclick="cancelCall()">Cancel</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    // Robust STUN + TURN config (handles NATs, Wi-Fi, and 4G/5G carriers)
    const PEER_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    let peer = null;
    let localStream = null;
    let currentMediaCall = null;
    let dataConn = null;
    let targetPeerId = null;

    // Retry / Knocking engine state
    let isDialing = false;
    let dialAttempts = 0;
    const MAX_DIAL_ATTEMPTS = 15; // 15 tries * 2.5s = ~38 seconds grace period
    let retryTimer = null;

    // Audio Visualizer & Timer
    let localCtx = null, localAnalyser = null, localAnim = null;
    let remoteCtx = null, remoteAnalyser = null, remoteAnim = null;
    let callStart = null, timerInt = null;
    let ringCtx = null, ringTimer = null;

    const myId = `vl-${Math.floor(1000 + Math.random() * 9000)}`;

    function init() {
      peer = new Peer(myId, { debug: 1, config: PEER_CONFIG });

      peer.on('open', (id) => {
        document.getElementById('myPeerId').innerText = id;
        document.getElementById('callBtn').disabled = false;
        document.getElementById('appStatus').innerText = "Online & Ready.";

        // Check if user arrived via an invite link (#call=vl-XXXX)
        checkUrlHash();
      });

      // Handle Inbound Signaling
      peer.on('connection', (conn) => {
        if (currentMediaCall || (dataConn && dataConn.open)) {
          conn.on('open', () => conn.send({ type: 'BUSY' }));
          return;
        }
        dataConn = conn;
        attachDataHandlers(conn);
      });

      // Handle Inbound Media stream
      peer.on('call', (call) => {
        currentMediaCall = call;
      });

      peer.on('error', (err) => {
        console.warn("Peer error caught:", err.type);

        // SMART RETRY: If peer isn't registered yet, do NOT crash!
        if (err.type === 'peer-unavailable' && isDialing) {
          handlePeerUnavailableRetry();
        } else if (err.type === 'peer-unavailable') {
          alert("Peer ID does not exist or went offline.");
          resetCallState();
        }
      });
    }

    // --- 1. Knocking / Auto-Retry Engine ---
    function startCall() {
      const target = document.getElementById('targetPeerId').value.trim();
      if (!target || target === myId) {
        alert("Enter a valid Friend ID!");
        return;
      }

      targetPeerId = target;
      isDialing = true;
      dialAttempts = 0;

      document.getElementById('dialingIdLabel').innerText = targetPeerId;
      document.getElementById('outgoingTitle').innerText = "Calling...";
      document.getElementById('dialingSubtext').innerText = "Reaching signaling server...";
      document.getElementById('outgoingModal').style.display = 'flex';
      playChime('outgoing');

      attemptHandshake();
    }

    function attemptHandshake() {
      if (!isDialing) return;
      dialAttempts++;

      if (dialAttempts > MAX_DIAL_ATTEMPTS) {
        stopChime();
        alert("Friend didn't come online. Please check the ID or invite link.");
        cancelCall();
        return;
      }

      if (dialAttempts > 1) {
        document.getElementById('outgoingTitle').innerText = "Waiting for Peer...";
        document.getElementById('dialingSubtext').innerText = `Friend hasn't opened page yet. Retrying (${dialAttempts}/${MAX_DIAL_ATTEMPTS})...`;
      }

      // Cleanup prior dead connection attempts
      if (dataConn) {
        try { dataConn.close(); } catch(e){}
        dataConn = null;
      }

      dataConn = peer.connect(targetPeerId, { reliable: true });
      attachDataHandlers(dataConn);

      dataConn.on('open', () => {
        // Connected! Cancel retry loop and send ring event
        clearTimeout(retryTimer);
        document.getElementById('outgoingTitle').innerText = "Ringing...";
        document.getElementById('dialingSubtext').innerText = "Waiting for them to answer...";
        dataConn.send({ type: 'RING' });
      });
    }

    function handlePeerUnavailableRetry() {
      clearTimeout(retryTimer);
      // Wait 2.5 seconds and knock again
      retryTimer = setTimeout(() => {
        if (isDialing) {
          attemptHandshake();
        }
      }, 2500);
    }

    // --- 2. Signaling Handlers ---
    function attachDataHandlers(conn) {
      conn.on('data', async (msg) => {
        switch (msg.type) {
          case 'RING':
            targetPeerId = conn.peer;
            document.getElementById('callerIdLabel').innerText = targetPeerId;
            document.getElementById('incomingModal').style.display = 'flex';
            playChime('incoming');
            break;

          case 'ACCEPT':
            isDialing = false;
            stopChime();
            document.getElementById('outgoingModal').style.display = 'none';
            // Start audio transmission
            await initiateAudioStream(conn.peer);
            break;

          case 'DECLINE':
            isDialing = false;
            stopChime();
            alert("Call was declined.");
            resetCallState();
            break;

          case 'CANCEL':
            stopChime();
            document.getElementById('incomingModal').style.display = 'none';
            resetCallState();
            break;

          case 'BUSY':
            isDialing = false;
            stopChime();
            alert("User is currently on another call.");
            resetCallState();
            break;

          case 'HANGUP':
            hangUp(false);
            break;
        }
      });

      conn.on('close', () => {
        if (!isDialing) hangUp(false);
      });
    }

    async function initiateAudioStream(peerId) {
      const gotMic = await getMic();
      if (!gotMic) {
        hangUp(true);
        return;
      }

      currentMediaCall = peer.call(peerId, localStream);
      currentMediaCall.on('stream', (remoteStream) => {
        activateCallUI(remoteStream, peerId);
      });
      currentMediaCall.on('close', () => hangUp(false));
    }

    // --- 3. Answering & Teardown ---
    async function acceptCall() {
      stopChime();
      document.getElementById('incomingModal').style.display = 'none';

      const gotMic = await getMic();
      if (!gotMic) {
        if (dataConn) dataConn.send({ type: 'DECLINE' });
        resetCallState();
        return;
      }

      dataConn.send({ type: 'ACCEPT' });

      // If caller's media stream arrives
      if (currentMediaCall) {
        currentMediaCall.answer(localStream);
        currentMediaCall.on('stream', (remoteStream) => {
          activateCallUI(remoteStream, currentMediaCall.peer);
        });
        currentMediaCall.on('close', () => hangUp(false));
      } else {
        peer.once('call', (call) => {
          currentMediaCall = call;
          call.answer(localStream);
          call.on('stream', (remoteStream) => {
            activateCallUI(remoteStream, call.peer);
          });
          call.on('close', () => hangUp(false));
        });
      }
    }

    function rejectCall() {
      stopChime();
      document.getElementById('incomingModal').style.display = 'none';
      if (dataConn) dataConn.send({ type: 'DECLINE' });
      resetCallState();
    }

    function cancelCall() {
      isDialing = false;
      clearTimeout(retryTimer);
      stopChime();
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'CANCEL' });
      }
      resetCallState();
      document.getElementById('outgoingModal').style.display = 'none';
    }

    function activateCallUI(stream, partnerId) {
      document.getElementById('dialerScreen').style.display = 'none';
      document.getElementById('activeCallScreen').style.display = 'flex';
      document.getElementById('partnerName').innerText = `Talking with: ${partnerId}`;

      const audio = document.getElementById('remoteAudio');
      audio.srcObject = stream;
      audio.play().catch(e => console.warn(e));

      visualize(localStream, 'localCanvas', 'local');
      visualize(stream, 'remoteCanvas', 'remote');
      startTimer();
    }

    function hangUp(sendSignal) {
      stopChime();
      if (sendSignal && dataConn && dataConn.open) {
        dataConn.send({ type: 'HANGUP' });
      }

      resetCallState();

      document.getElementById('outgoingModal').style.display = 'none';
      document.getElementById('incomingModal').style.display = 'none';
      document.getElementById('activeCallScreen').style.display = 'none';
      document.getElementById('dialerScreen').style.display = 'flex';
      document.getElementById('appStatus').innerText = "Call ended.";
    }

    function resetCallState() {
      isDialing = false;
      clearTimeout(retryTimer);

      if (currentMediaCall) { currentMediaCall.close(); currentMediaCall = null; }
      if (dataConn) { dataConn.close(); dataConn = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      document.getElementById('remoteAudio').srcObject = null;
      stopVisualizer('local');
      stopVisualizer('remote');
      stopTimer();
    }

    // --- 4. Microphones & Controls ---
    async function getMic() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        return true;
      } catch (err) {
        alert("Microphone permission denied! Please allow mic access.");
        return false;
      }
    }

    let micMuted = false, deaf = false;
    function toggleMute() {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks()[0].enabled = !micMuted;
      document.getElementById('muteBtn').innerText = micMuted ? "🔇 Unmute" : "🎤 Mute";
      document.getElementById('muteBtn').classList.toggle('active-off', micMuted);
    }

    function toggleDeafen() {
      const audio = document.getElementById('remoteAudio');
      deaf = !deaf;
      audio.muted = deaf;
      document.getElementById('deafenBtn').innerText = deaf ? "🔈 Undeafen" : "🔊 Deafen";
      document.getElementById('deafenBtn').classList.toggle('active-off', deaf);
    }

    // --- 5. Visualizer ---
    function visualize(stream, canvasId, type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      src.connect(analyser);

      if (type === 'local') { localCtx = ctx; localAnalyser = analyser; }
      else { remoteCtx = ctx; remoteAnalyser = analyser; }

      const canvas = document.getElementById(canvasId);
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const cCtx = canvas.getContext('2d');
      const data = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        const anim = requestAnimationFrame(draw);
        if (type === 'local') localAnim = anim; else remoteAnim = anim;

        analyser.getByteFrequencyData(data);
        cCtx.fillStyle = '#0b0f19';
        cCtx.fillRect(0, 0, canvas.width, canvas.height);

        const w = (canvas.width / data.length) * 1.5;
        let x = 0;
        for (let i = 0; i < data.length; i++) {
          const h = (data[i] / 255) * canvas.height;
          cCtx.fillStyle = type === 'local' ? '#38bdf8' : '#10b981';
          cCtx.fillRect(x, canvas.height - h, w, h);
          x += w + 2;
        }
      }
      draw();
    }

    function stopVisualizer(type) {
      if (type === 'local') {
        if (localAnim) cancelAnimationFrame(localAnim);
        if (localCtx && localCtx.state !== 'closed') localCtx.close();
      } else {
        if (remoteAnim) cancelAnimationFrame(remoteAnim);
        if (remoteCtx && remoteCtx.state !== 'closed') remoteCtx.close();
      }
    }

    // --- 6. Timer & Tones ---
    function startTimer() {
      callStart = Date.now();
      timerInt = setInterval(() => {
        const d = Math.floor((Date.now() - callStart) / 1000);
        const m = String(Math.floor(d / 60)).padStart(2, '0');
        const s = String(d % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInt) clearInterval(timerInt);
      document.getElementById('callTimer').innerText = '00:00';
    }

    function playChime(type) {
      stopChime();
      ringCtx = new (window.AudioContext || window.webkitAudioContext)();
      function tone() {
        if (!ringCtx || ringCtx.state === 'closed') return;
        const osc = ringCtx.createOscillator();
        const g = ringCtx.createGain();
        osc.connect(g); g.connect(ringCtx.destination);
        const t = ringCtx.currentTime;

        if (type === 'outgoing') {
          osc.frequency.setValueAtTime(440, t);
          g.gain.setValueAtTime(0.08, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
          osc.start(t); osc.stop(t + 1.2);
        } else {
          osc.frequency.setValueAtTime(659, t);
          osc.frequency.setValueAtTime(523, t + 0.2);
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
          osc.start(t); osc.stop(t + 0.8);
        }
      }
      tone();
      ringTimer = setInterval(tone, type === 'outgoing' ? 2500 : 2000);
    }

    function stopChime() {
      if (ringTimer) clearInterval(ringTimer);
      if (ringCtx && ringCtx.state !== 'closed') ringCtx.close();
    }

    // --- 7. URL Linking & Sharing ---
    function checkUrlHash() {
      const hash = window.location.hash;
      if (hash && hash.includes('#call=')) {
        const target = hash.replace('#call=', '').trim();
        if (target && target !== myId) {
          document.getElementById('targetPeerId').value = target;
          document.getElementById('appStatus').innerText = `Target ID autofilled from link: ${target}`;
        }
      }
    }

    function copyIdOnly() {
      navigator.clipboard.writeText(myId);
      alert(`Copied ID: ${myId}`);
    }

    function copyInviteLink() {
      // Build an instant link pointing to this same file with the hash
      const cleanUrl = window.location.origin + window.location.pathname;
      const inviteUrl = `${cleanUrl}#call=${myId}`;
      navigator.clipboard.writeText(inviteUrl);
      alert(`Invite link copied to clipboard!\nSend this to your friend: ${inviteUrl}`);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
