<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceLink Pro – Reliable P2P Calling</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d16; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    header { text-align: center; }
    header h1 { font-size: 1.5rem; color: #38bdf8; }
    header p { font-size: 0.82rem; color: #94a3b8; margin-top: 4px; }
    
    .id-box { background: #0b0f19; border: 1px dashed #38bdf8; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; }
    .id-value { font-family: monospace; font-size: 1.15rem; font-weight: 700; color: #38bdf8; letter-spacing: 1px; }
    
    input[type="text"] { width: 100%; padding: 14px; background: #0b0f19; border: 1px solid #374151; border-radius: 12px; color: white; font-size: 1rem; outline: none; text-align: center; font-family: monospace; }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-green { background: #10b981; color: white; }
    .btn-green:hover { background: #059669; }
    .btn-red { background: #ef4444; color: white; }
    .btn-red:hover { background: #dc2626; }
    .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    .status-text { font-size: 0.8rem; color: #94a3b8; text-align: center; }

    /* In-Call Screen */
    #activeCallScreen { display: none; text-align: center; }
    .timer-badge { display: inline-block; background: #1e293b; padding: 6px 14px; border-radius: 20px; font-family: monospace; font-size: 1.1rem; color: #10b981; font-weight: 700; }
    .call-controls { display: flex; gap: 10px; margin-top: 10px; }
    .control-btn { flex: 1; padding: 12px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .control-btn.active-off { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }

    canvas { width: 100%; height: 44px; background: #0b0f19; border-radius: 8px; border: 1px solid #1f2937; display: block; }
    .meter-label { font-size: 0.75rem; color: #94a3b8; text-align: left; text-transform: uppercase; margin-bottom: 4px; }

    /* Calling Popups */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-box { width: 100%; max-width: 340px; background: #111827; border: 1px solid #374151; border-radius: 20px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
    .pulse-avatar { width: 68px; height: 68px; margin: 0 auto; border-radius: 50%; background: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; animation: pulse-ring 1.5s infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(2,132,199,0.7); } 70% { box-shadow: 0 0 0 16px rgba(2,132,199,0); } 100% { box-shadow: 0 0 0 0 rgba(2,132,199,0); } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>VoiceLink Pro</h1>
      <p>P2P Audio Calling with TURN Relay Support</p>
    </header>

    <!-- IDLE / DIALER -->
    <div class="card" id="dialerScreen">
      <div>
        <div class="meter-label" style="text-align:center;">Your Personal ID</div>
        <div class="id-box" onclick="copyId()">
          <div class="id-value" id="myPeerId">Connecting...</div>
          <small style="color: #64748b; font-size: 0.72rem;">(Tap to copy)</small>
        </div>
      </div>

      <div>
        <label class="meter-label">Enter Peer ID</label>
        <input type="text" id="targetPeerId" placeholder="e.g. vl-4821" />
      </div>

      <button class="btn btn-green" id="callBtn" onclick="startCallFlow()" disabled>
        📞 Call Now
      </button>

      <div class="status-text" id="appStatus">Connecting to signaling network...</div>
    </div>

    <!-- IN-CALL SCREEN -->
    <div class="card" id="activeCallScreen">
      <div>
        <div class="timer-badge" id="callTimer">00:00</div>
        <div style="font-size: 1rem; font-weight: 700; margin-top: 6px;" id="partnerName">In Call</div>
      </div>

      <div>
        <div class="meter-label">Your Voice</div>
        <canvas id="localCanvas"></canvas>
      </div>

      <div>
        <div class="meter-label">Partner's Voice</div>
        <canvas id="remoteCanvas"></canvas>
      </div>

      <div class="call-controls">
        <button class="control-btn" id="muteBtn" onclick="toggleMute()">🎤 Mute</button>
        <button class="control-btn" id="deafenBtn" onclick="toggleDeafen()">🔊 Deafen</button>
      </div>

      <button class="btn btn-red" onclick="hangUp(true)">
        🛑 End Call
      </button>
    </div>
  </div>

  <!-- INCOMING CALL MODAL -->
  <div class="modal-overlay" id="incomingModal">
    <div class="modal-box">
      <div class="pulse-avatar">📲</div>
      <div>
        <h3>Incoming Voice Call</h3>
        <p style="font-family: monospace; color: #38bdf8; margin-top: 4px;" id="callerIdLabel">vl-XXXX</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-green" onclick="acceptCall()">Accept</button>
        <button class="btn btn-red" onclick="rejectCall()">Decline</button>
      </div>
    </div>
  </div>

  <!-- OUTGOING CALL MODAL -->
  <div class="modal-overlay" id="outgoingModal">
    <div class="modal-box">
      <div class="pulse-avatar">📞</div>
      <div>
        <h3>Calling...</h3>
        <p style="font-family: monospace; color: #38bdf8; margin-top: 4px;" id="dialingIdLabel">vl-XXXX</p>
        <small style="color: #64748b;" id="dialingSubtext">Ringing...</small>
      </div>
      <button class="btn btn-red" onclick="cancelOutgoingCall()">Cancel</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    // --- STUN + TURN SERVERS (Crucial for Mobile & Symmetric NATs) ---
    const PEER_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        // Public TURN Relay from OpenRelay Project (bypasses carrier NAT firewalls)
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    let peer = null;
    let localStream = null;
    let currentCall = null;
    let dataConn = null; // Signaling channel
    let remotePeerId = null;

    let localCtx = null, localAnalyser = null, localAnim = null;
    let remoteCtx = null, remoteAnalyser = null, remoteAnim = null;
    let timerInt = null, callStart = null;
    let ringCtx = null, ringTimer = null;

    const myId = `vl-${Math.floor(1000 + Math.random() * 9000)}`;

    function init() {
      peer = new Peer(myId, {
        debug: 1,
        config: PEER_CONFIG
      });

      peer.on('open', (id) => {
        document.getElementById('myPeerId').innerText = id;
        document.getElementById('callBtn').disabled = false;
        document.getElementById('appStatus').innerText = "Online. Ready to connect.";
        startHeartbeat(); // Keep connection alive
      });

      // 1. DATA CHANNEL (Signaling: Ring, Accept, Decline, Hangup)
      peer.on('connection', (conn) => {
        if (currentCall || dataConn) {
          // If already in a call, send busy
          conn.on('open', () => conn.send({ type: 'BUSY' }));
          return;
        }

        dataConn = conn;
        setupDataChannel(conn);
      });

      // 2. MEDIA CHANNEL (Audio)
      peer.on('call', (call) => {
        currentCall = call;
        // Don't auto-answer yet! Wait for user to click Accept.
      });

      peer.on('disconnected', () => {
        peer.reconnect();
      });

      peer.on('error', (err) => {
        console.error("Peer error:", err);
        if (err.type === 'peer-unavailable') {
          alert("Peer ID not found or offline.");
          hangUp(false);
        }
      });
    }

    // --- Data Channel Protocol ---
    function setupDataChannel(conn) {
      conn.on('data', (data) => {
        switch (data.type) {
          case 'RING':
            remotePeerId = conn.peer;
            document.getElementById('callerIdLabel').innerText = remotePeerId;
            document.getElementById('incomingModal').style.display = 'flex';
            playChime('incoming');
            break;

          case 'ACCEPT':
            stopChime();
            document.getElementById('outgoingModal').style.display = 'none';
            // Partner accepted! Send audio stream now
            sendAudioStream(conn.peer);
            break;

          case 'DECLINE':
            alert("Call declined.");
            hangUp(false);
            break;

          case 'CANCEL':
            stopChime();
            document.getElementById('incomingModal').style.display = 'none';
            resetState();
            break;

          case 'BUSY':
            alert("User is currently on another call.");
            hangUp(false);
            break;

          case 'HANGUP':
            hangUp(false);
            break;
        }
      });

      conn.on('close', () => {
        hangUp(false);
      });
    }

    // --- Outgoing Call Flow ---
    async function startCallFlow() {
      const target = document.getElementById('targetPeerId').value.trim();
      if (!target || target === myId) return alert("Enter a valid Friend ID!");

      const gotMic = await getMic();
      if (!gotMic) return;

      remotePeerId = target;
      document.getElementById('dialingIdLabel').innerText = target;
      document.getElementById('outgoingModal').style.display = 'flex';
      playChime('outgoing');

      // 1. Establish Signaling Link
      dataConn = peer.connect(target, { reliable: true });
      setupDataChannel(dataConn);

      dataConn.on('open', () => {
        dataConn.send({ type: 'RING' });
      });
    }

    // Caller transmits media once Receiver has accepted
    function sendAudioStream(targetId) {
      currentCall = peer.call(targetId, localStream);
      
      currentCall.on('stream', (remoteStream) => {
        attachSession(remoteStream, targetId);
      });

      currentCall.on('close', () => hangUp(false));
    }

    // --- Incoming Call Flow ---
    async function acceptCall() {
      stopChime();
      document.getElementById('incomingModal').style.display = 'none';

      const gotMic = await getMic();
      if (!gotMic) {
        if (dataConn) dataConn.send({ type: 'DECLINE' });
        resetState();
        return;
      }

      // Notify caller that we accepted
      dataConn.send({ type: 'ACCEPT' });

      // When caller initiates the media call, answer with our stream
      if (currentCall) {
        currentCall.answer(localStream);
        currentCall.on('stream', (remoteStream) => {
          attachSession(remoteStream, currentCall.peer);
        });
        currentCall.on('close', () => hangUp(false));
      } else {
        // If media packet hasn't landed yet, listen for it
        peer.once('call', (call) => {
          currentCall = call;
          call.answer(localStream);
          call.on('stream', (remoteStream) => {
            attachSession(remoteStream, call.peer);
          });
          call.on('close', () => hangUp(false));
        });
      }
    }

    function rejectCall() {
      stopChime();
      document.getElementById('incomingModal').style.display = 'none';
      if (dataConn) dataConn.send({ type: 'DECLINE' });
      resetState();
    }

    function cancelOutgoingCall() {
      if (dataConn) dataConn.send({ type: 'CANCEL' });
      hangUp(false);
    }

    // --- Active Session ---
    function attachSession(stream, partnerId) {
      document.getElementById('dialerScreen').style.display = 'none';
      document.getElementById('activeCallScreen').style.display = 'flex';
      document.getElementById('partnerName').innerText = `Talking with: ${partnerId}`;

      const audio = document.getElementById('remoteAudio');
      audio.srcObject = stream;
      audio.play().catch(e => console.warn(e));

      visualize(localStream, 'localCanvas', 'local');
      visualize(stream, 'remoteCanvas', 'remote');

      startTimer();
    }

    function hangUp(sendSignal) {
      stopChime();
      if (sendSignal && dataConn && dataConn.open) {
        dataConn.send({ type: 'HANGUP' });
      }

      resetState();

      document.getElementById('outgoingModal').style.display = 'none';
      document.getElementById('incomingModal').style.display = 'none';
      document.getElementById('activeCallScreen').style.display = 'none';
      document.getElementById('dialerScreen').style.display = 'flex';
      document.getElementById('appStatus').innerText = "Call ended.";
    }

    function resetState() {
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (dataConn) { dataConn.close(); dataConn = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      document.getElementById('remoteAudio').srcObject = null;
      stopVisualizer('local');
      stopVisualizer('remote');
      stopTimer();
    }

    // --- Hardware Access ---
    async function getMic() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        return true;
      } catch (err) {
        alert("Microphone permission required to make calls.");
        return false;
      }
    }

    let micMuted = false, deaf = false;
    function toggleMute() {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks()[0].enabled = !micMuted;
      document.getElementById('muteBtn').innerText = micMuted ? "🔇 Unmute" : "🎤 Mute";
      document.getElementById('muteBtn').classList.toggle('active-off', micMuted);
    }

    function toggleDeafen() {
      const audio = document.getElementById('remoteAudio');
      deaf = !deaf;
      audio.muted = deaf;
      document.getElementById('deafenBtn').innerText = deaf ? "🔈 Undeafen" : "🔊 Deafen";
      document.getElementById('deafenBtn').classList.toggle('active-off', deaf);
    }

    // --- Visualizer ---
    function visualize(stream, canvasId, type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      src.connect(analyser);

      if (type === 'local') { localCtx = ctx; localAnalyser = analyser; }
      else { remoteCtx = ctx; remoteAnalyser = analyser; }

      const canvas = document.getElementById(canvasId);
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const cCtx = canvas.getContext('2d');
      const data = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        const anim = requestAnimationFrame(draw);
        if (type === 'local') localAnim = anim; else remoteAnim = anim;

        analyser.getByteFrequencyData(data);
        cCtx.fillStyle = '#0b0f19';
        cCtx.fillRect(0, 0, canvas.width, canvas.height);

        const w = (canvas.width / data.length) * 1.5;
        let x = 0;
        for (let i = 0; i < data.length; i++) {
          const h = (data[i] / 255) * canvas.height;
          cCtx.fillStyle = type === 'local' ? '#38bdf8' : '#10b981';
          cCtx.fillRect(x, canvas.height - h, w, h);
          x += w + 2;
        }
      }
      draw();
    }

    function stopVisualizer(type) {
      if (type === 'local') {
        if (localAnim) cancelAnimationFrame(localAnim);
        if (localCtx && localCtx.state !== 'closed') localCtx.close();
      } else {
        if (remoteAnim) cancelAnimationFrame(remoteAnim);
        if (remoteCtx && remoteCtx.state !== 'closed') remoteCtx.close();
      }
    }

    // --- Timer ---
    function startTimer() {
      callStart = Date.now();
      timerInt = setInterval(() => {
        const d = Math.floor((Date.now() - callStart) / 1000);
        const m = String(Math.floor(d / 60)).padStart(2, '0');
        const s = String(d % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInt) clearInterval(timerInt);
      document.getElementById('callTimer').innerText = '00:00';
    }

    // --- Ringtone Synthesis ---
    function playChime(type) {
      stopChime();
      ringCtx = new (window.AudioContext || window.webkitAudioContext)();
      function tone() {
        if (!ringCtx || ringCtx.state === 'closed') return;
        const osc = ringCtx.createOscillator();
        const g = ringCtx.createGain();
        osc.connect(g); g.connect(ringCtx.destination);
        const t = ringCtx.currentTime;
        if (type === 'outgoing') {
          osc.frequency.setValueAtTime(440, t);
          g.gain.setValueAtTime(0.08, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
          osc.start(t); osc.stop(t + 1.2);
        } else {
          osc.frequency.setValueAtTime(659, t);
          osc.frequency.setValueAtTime(523, t + 0.2);
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
          osc.start(t); osc.stop(t + 0.8);
        }
      }
      tone();
      ringTimer = setInterval(tone, type === 'outgoing' ? 2500 : 2000);
    }

    function stopChime() {
      if (ringTimer) clearInterval(ringTimer);
      if (ringCtx && ringCtx.state !== 'closed') ringCtx.close();
    }

    // Keep WebSocket Alive on PeerJS Public Server
    function startHeartbeat() {
      setInterval(() => {
        if (peer && peer.socket && peer.socket._open) {
          peer.socket.send({ type: 'HEARTBEAT' });
        }
      }, 20000);
    }

    function copyId() {
      navigator.clipboard.writeText(document.getElementById('myPeerId').innerText);
      alert("ID Copied!");
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
